<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factory Inventory Management System</title>
    <!-- Set the theme before first paint so a dark-mode user never sees a white flash while the
       JS bundle loads. Must mirror the resolution order in composables/useTheme.js. -->
    <script>
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('app-theme')
        } catch (e) {}
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
