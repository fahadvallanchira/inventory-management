name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run backend tests with coverage
        run: |
          cd tests
          uv run --project ../server pytest --cov

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # package-lock.json is gitignored and .npmrc pins the public registry,
      # so `npm ci` is not usable here.
      - name: Install and build
        run: |
          cd client
          npm install
          npm run build
